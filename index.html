<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Spider-game</title>
  <style>
    html, body { height: 100%; margin: 0; background: #0f1220; color: #eaeefb; font-family: system-ui, Arial, sans-serif; }
    .wrap { max-width: 960px; margin: 0 auto; padding: 16px; }
    canvas { width: 100%; height: 480px; display: block; background: #18203a; border-radius: 12px; }
    .hint { opacity: 0.8; font-size: 14px; margin-top: 8px; }
    .title { margin: 0 0 12px; }
  </style>
</head>
<body>
  <div class="wrap">
    <h1 class="title">Spider-game (demo)</h1>
    <canvas id="game" width="960" height="480"></canvas>
    <div class="hint">
      Arrow keys để di chuyển spider • Click vào canvas để focus • Tự do sửa mã nguồn trong <code>src/</code>
    </div>
  </div>

  <script type="module">
    import { boot } from './src/main.js';
    boot(document.getElementById('game'));
  </script>
</body>
</html>
